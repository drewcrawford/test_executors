[package]
name = "test_executors"
version = "0.5.0"
edition = "2024"
description = "Simple async executors for testing."
license = "MIT OR Apache-2.0"
homepage = "https://sealedabstract.com/code/test_executors"
repository = "https://github.com/drewcrawford/test_executors"
keywords = ["testing","async","await","future"]
categories = ["asynchronous", "concurrency", "development-tools::testing"]
exclude = [".*"]
rust-version = "1.85.1"

[features]
logwise_internal = []

# test_executors_proc is a path dependency AND has a dev-dependency back on this
# crate. Without a workspace it forms its own, so it cannot see the
# [patch.crates-io] block below, and resolves the siblings from the registry --
# which fails outright whenever this crate requires a sibling version that is
# not published yet. One workspace, one patch block, one lockfile.
[workspace]
members = ["test_executors_proc"]

[dependencies]
some_executor = "0.7"
logwise = "0.6"
test_executors_proc = { version = "0.5.0", path = "test_executors_proc" }

[dev-dependencies]

# wasm-32 support
[target.'cfg(target_arch="wasm32")'.dependencies]
# Only `spawn_local` uses this, and only on wasm32; native builds do not need it.
wasm_lite_std = "0.1.1"

[target.'cfg(target_arch="wasm32")'.dev-dependencies]
# Supplies `#[wasm_lite_test]` for this crate's own wasm32 tests. A dev-dependency,
# so consumers never build it.
wasm_lite = "0.1.1"

# Dev-cycle sibling patches. Only the *root* package's [patch] is honoured, so the
# equivalent blocks in ../some_executor and ../logwise do nothing when this crate
# is the one being built -- they have to be restated here.
#
# These entries require the ../wasm_lite, ../some_executor and ../logwise
# checkouts to be present; without them cargo cannot resolve this crate at all.
[patch.crates-io]
# wasm_lite must resolve to a single instance. ../logwise takes wasm_lite and
# wasm_lite_std *by path*, while this crate and ../some_executor take them from the
# registry, so an unpatched graph carries two copies. wasm_lite exports #[no_mangle]
# symbols (__wl_malloc, __wl_thread_entry, __wl_closure_call_0, ...), so that is not
# a silent duplicate -- every wasm32 binary fails to link with
# "rust-lld: error: duplicate symbol". Patching the registry entries at the same
# checkout unifies them; [dependencies] stays on the published version.
wasm_lite = { path = "../wasm_lite/crates/wasm_lite" }
wasm_lite_std = { path = "../wasm_lite/crates/wasm_lite_std" }
# The three siblings release together, so build against the working copies rather
# than the last-published ones -- otherwise the registry some_executor/logwise drag
# their own (registry) wasm_lite back in, reintroducing the duplicate above.
some_executor = { path = "../some_executor" }
logwise = { path = "../logwise" }
# `continue` is reached via some_executor and needs no patch: 0.1.3 takes wasm_lite
# only as a wasm32 *dev*-dependency, which does not reach us. Re-add a patch here
# only if a future release puts it back on a normal dependency.
