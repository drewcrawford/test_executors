[package]
name = "test_executors"
version = "0.4.1"
edition = "2024"
description = "Simple async executors for testing."
license = "MIT OR Apache-2.0"
homepage = "https://sealedabstract.com/code/test_executors"
repository = "https://github.com/drewcrawford/test_executors"
keywords = ["testing","async","await","future"]
categories = ["asynchronous", "concurrency", "development-tools::testing"]
exclude = [".*"]
rust-version = "1.85.1"

[features]
logwise_internal = []

[dependencies]
some_executor = "0.6.3"
logwise = "0.5.0"
test_executors_proc = { version = "0.3.5", path = "test_executors_proc" }

[dev-dependencies]

# wasm-32 support
[target.'cfg(target_arch="wasm32")'.dependencies]
# Only `spawn_local` uses this, and only on wasm32; native builds do not need it.
wasm_lite_std = "0.1.1"

[target.'cfg(target_arch="wasm32")'.dev-dependencies]
# Supplies `#[wasm_lite_test]` for this crate's own wasm32 tests. A dev-dependency,
# so consumers never build it.
wasm_lite = "0.1.1"
