[package]
name = "test_executors"
version = "0.4.1"
edition = "2024"
description = "Simple async executors for testing."
license = "MIT OR Apache-2.0"
homepage = "https://sealedabstract.com/code/test_executors"
repository = "https://github.com/drewcrawford/test_executors"
keywords = ["testing","async","await","future"]
categories = ["asynchronous", "concurrency", "development-tools::testing"]
exclude = [".*"]
rust-version = "1.85.1"

[features]
logwise_internal = []

[dependencies]
some_executor = "0.6.3"
wasm_lite_std = { path = "../wasm_lite/crates/wasm_lite_std" }
logwise = "0.5.0"
test_executors_proc = { version = "0.3.5", path = "test_executors_proc" }

[dev-dependencies]

# wasm-32 support
[target.'cfg(target_arch="wasm32")'.dependencies]

[target.'cfg(target_arch="wasm32")'.dev-dependencies]
# Path-only, so `cargo publish` strips it and consumers never see it.
wasm_lite = { path = "../wasm_lite/crates/wasm_lite" }
